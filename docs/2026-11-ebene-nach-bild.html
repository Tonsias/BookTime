<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ebene nach Bild</title>
<style>
  :root { --bg:#0b0d12; --panel:#14161e; --line:#262d3e; --text:#d7dbe6; --dim:#8a91a5; --accent:#6b8cff; --warn:#facc15; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:16px; } header p { margin:4px 0 0; color:var(--dim); font-size:13px; }
  main { display:grid; grid-template-columns:1fr 320px; gap:0; min-height:calc(100vh - 64px); }
  .views { display:grid; grid-template-rows:auto 1fr; min-width:0; overflow:hidden; }
  .tabs { display:flex; gap:6px; padding:10px 16px; border-bottom:1px solid var(--line); }
  .tabs button, .btn { background:#1a1f2c; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit; font-size:13px; }
  .tabs button.on { border-color:var(--accent); color:#fff; background:#1e2740; }
  svg { width:100%; height:100%; min-height:420px; display:block; overflow:hidden; }
  aside { position:relative; z-index:1; background:var(--panel); border-left:1px solid var(--line); padding:16px; overflow:auto; }
  h3 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:18px 0 8px; }
  h3:first-child { margin-top:0; }
  .row { display:flex; gap:8px; } .row label { flex:1; font-size:12px; color:var(--dim); }
  .row input { width:100%; margin-top:3px; background:#0f121a; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:5px 7px; font:inherit; }
  .drop { border:1px dashed var(--line); border-radius:8px; padding:10px; text-align:center; color:var(--dim); font-size:12px; }
  .drop .btn { margin:4px 2px 0; font-size:12px; }
  .points a { display:flex; gap:8px; padding:4px 6px; border-radius:5px; cursor:pointer; color:var(--text); text-decoration:none; }
  .points a.on { background:#1e2740; } .points small { margin-left:auto; color:var(--dim); }
  .hint { border:1px solid #5a4a12; background:rgba(250,204,21,.08); border-radius:8px; padding:8px 10px; font-size:13px; margin-top:6px; }
  .hint .btn { margin-top:6px; font-size:12px; }
  .note { color:var(--dim); font-size:12px; }
  .label { font-size:12px; fill:var(--text); } .label.on { fill:#fff; font-weight:600; }
  @media (max-width:800px){ main { grid-template-columns:1fr; } aside { border-left:0; border-top:1px solid var(--line); } .views { min-height:60vh; } }
</style>
</head>
<body>
<header>
  <h1>Zeitebene übernimmt Form und Größe ihres Hintergrundbilds</h1>
  <p>Prototyp zu Issue #4. Lade Bilder hoch (Pixelgröße wählbar), verschiebe Karten, wechsle Zeitpunkte. Doppelklick in der Netz-Ansicht legt einen Ort an, aber nur auf der Fläche.</p>
</header>
<main>
  <section class="views">
    <div class="tabs"><button id="t-raum" class="on">Raum</button><button id="t-netz">Netz</button></div>
    <svg id="view"></svg>
  </section>
  <aside>
    <h3>Zeitpunkte</h3>
    <div class="points" id="points"></div>
    <h3>Hintergrund</h3>
    <div id="bg"></div>
    <h3>Hinweise</h3>
    <div id="hints"></div>
  </aside>
</main>
<script>
const PX = 50, DEF = 22
const points = [
  { name:'Aufbruch', bg:null },
  { name:'Ankunft in Velmar', bg:{ x:0, y:0, width:22, height:14, hue:200 } },
  { name:'Das Konzil', bg:null },
  { name:'Verrat auf Ostfels', bg:{ x:4, y:2, width:30, height:30, hue:30 } },
]
const places = [
  { name:'Velmar', x:-6, y:3, color:'#6b8cff' },
  { name:'Ostfels', x:8, y:-4, color:'#f87171' },
  { name:'Kloster', x:13, y:10, color:'#4ade80' },
]
let current = 1, view = 'raum'

// Festlegungen 2–4: eigener/geerbter Hintergrund, sonst erster späterer, sonst Quadrat
function layerAt(i) {
  for (let k = i; k >= 0; k--) if (points[k].bg) return points[k].bg
  const later = points.slice(i + 1).find((p) => p.bg)
  return later ? later.bg : { x:0, y:0, width:DEF, height:DEF, hue:null }
}
const inside = (r, p) => Math.abs(p.x - r.x) <= r.width / 2 && Math.abs(p.y - r.y) <= r.height / 2
const clamp = (r, p) => ({ x: Math.min(r.x + r.width / 2, Math.max(r.x - r.width / 2, p.x)), y: Math.min(r.y + r.height / 2, Math.max(r.y - r.height / 2, p.y)) })

const svg = document.getElementById('view')
const el = (tag, attrs, parent = svg) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e }
const mapFill = (r) => r.hue === null ? 'rgba(107,140,255,.07)' : `hsl(${r.hue} 35% 32%)`

function drawRaum() {
  const { width: W, height: H } = svg.getBoundingClientRect(), gap = W / (points.length + 0.6), k = Math.min(gap / 15, H / 40)
  const P = (s, u, v) => [gap * (s + 0.8) + u * k * 0.55, H / 2 - v * k + u * k * 0.35]
  points.forEach((pt, i) => {
    const r = layerAt(i), on = i === current
    const c = [[-1,-1],[1,-1],[1,1],[-1,1]].map(([a, b]) => P(i, r.x + a * r.width / 2, r.y + b * r.height / 2))
    const poly = el('polygon', { points: c.map((p) => p.join(',')).join(' '), fill: mapFill(r), 'fill-opacity': on ? .75 : .3, stroke: on ? '#6b8cff' : '#3a4152', 'stroke-width': on ? 2 : 1, style:'cursor:pointer' })
    poly.onclick = () => { current = i; render() }
    places.forEach((pl) => { const [x, y] = P(i, pl.x, pl.y); el('circle', { cx:x, cy:y, r: on ? 4 : 2.5, fill: pl.color, opacity: on ? 1 : .5 }) })
    const [lx, ly] = P(i, r.x, r.y + r.height / 2 + 4)
    const t = el('text', { x:lx, y:ly, 'text-anchor':'middle', class:'label' + (on ? ' on' : '') }); t.textContent = `${i + 1}. ${pt.name}`
  })
}

function drawNetz() {
  const { width: W, height: H } = svg.getBoundingClientRect(), r = layerAt(current)
  // Festlegung 12: Kamera auf Mitte der Ebene, ganze Ebene sichtbar
  // Im Prototyp zusätzlich Orte außerhalb samt Ring einbeziehen, damit sie sichtbar bleiben
  const du = Math.max(r.width / 2, ...places.map((p) => Math.abs(p.x - r.x) + 2.5)), dv = Math.max(r.height / 2, ...places.map((p) => Math.abs(p.y - r.y) + 3.5))
  const k = Math.min((W - 60) / (2 * du), (H - 80) / (2 * dv))
  const P = (u, v) => [W / 2 + (u - r.x) * k, H / 2 + 10 - (v - r.y) * k]
  const [x0, y0] = P(r.x - r.width / 2, r.y + r.height / 2)
  el('rect', { x:x0, y:y0, width:r.width * k, height:r.height * k, fill: mapFill(r), 'fill-opacity': r.hue === null ? 1 : .55, stroke:'#6b8cff', 'stroke-width':1.5 })
  const t = el('text', { x:W / 2, y:y0 - 10, 'text-anchor':'middle', class:'label on' }); t.textContent = `${current + 1}. ${points[current].name} · ${r.width} × ${r.height}`
  places.forEach((pl) => {
    const [x, y] = P(pl.x, pl.y), out = !inside(r, pl)
    el('circle', { cx:x, cy:y, r:2.1 * k, fill:'none', stroke:pl.color, 'stroke-width':2, 'stroke-dasharray': out ? '5 4' : '' })
    const l = el('text', { x, y:y + 2.1 * k + 14, 'text-anchor':'middle', class:'label', fill:pl.color }); l.textContent = pl.name + (out ? ' ⚠' : '')
  })
  svg.ondblclick = (e) => {
    const b = svg.getBoundingClientRect(), u = (e.clientX - b.left - W / 2) / k + r.x, v = -(e.clientY - b.top - H / 2 - 10) / k + r.y
    if (!inside(r, { x:u, y:v })) return
    places.push({ name:'Neuer Ort', x:+u.toFixed(1), y:+v.toFixed(1), color:'#c084fc' }); render()
  }
}

function upload(w, h) {
  const p = points[current], width = +(w / PX).toFixed(1), height = +(h / PX).toFixed(1)
  // Festlegung 7: Ersetzen behält den Mittelpunkt
  p.bg = p.bg ? { ...p.bg, width, height, hue:(p.bg.hue + 70) % 360 } : { x:0, y:0, width, height, hue:(current * 90 + 140) % 360 }
  render()
}

function renderPanel() {
  document.getElementById('points').innerHTML = points.map((p, i) => {
    const r = layerAt(i), how = p.bg ? 'eigenes Bild' : points.slice(0, i).some((q) => q.bg) ? 'geerbt' : r.hue === null ? 'Quadrat' : 'Form des nächsten'
    return `<a class="${i === current ? 'on' : ''}" data-i="${i}">${i + 1}. ${p.name}<small>${how}</small></a>`
  }).join('')
  document.querySelectorAll('.points a').forEach((a) => a.onclick = () => { current = +a.dataset.i; render() })
  const bg = points[current].bg, sizes = '<button class="btn" data-s="1100,700">1100 × 700</button><button class="btn" data-s="1100,1100">1100 × 1100</button><button class="btn" data-s="2400,1200">2400 × 1200</button>'
  document.getElementById('bg').innerHTML = bg ? `
    <div class="row"><label>X<input type="number" step="0.5" data-f="x" value="${bg.x}"></label><label>Y<input type="number" step="0.5" data-f="y" value="${bg.y}"></label><label>Breite<input type="number" step="1" min="1" data-f="width" value="${bg.width}"></label></div>
    <p class="note">Höhe ${bg.height} (folgt der Breite)</p>
    <div class="drop">Neues Bild ablegen: Mitte bleibt, Größe nach Pixeln (50 px = 1)<br>${sizes}</div>`
    : `<div class="drop">${points.slice(0, current).some((q) => q.bg) ? 'Erbt den Hintergrund des früheren Zeitpunkts.' : 'Kein Hintergrund.'}<br>Bild ablegen (Größe nach Pixeln, 50 px = 1)<br>${sizes}</div>`
  document.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => upload(...b.dataset.s.split(',').map(Number)))
  document.querySelectorAll('[data-f]').forEach((inp) => inp.onchange = () => {
    const v = +inp.value, f = inp.dataset.f
    if (f === 'width') { if (v <= 0) return; bg.height = +(bg.height * v / bg.width).toFixed(1); bg.width = v } else bg[f] = v
    render()
  })
  // Festlegung 14: je Ort der erste Zeitpunkt außerhalb der Fläche
  const hints = places.map((pl) => ({ pl, i: points.findIndex((_, i) => !inside(layerAt(i), pl)) })).filter((h) => h.i >= 0)
  const box = document.getElementById('hints')
  box.innerHTML = hints.length ? '' : '<p class="note">Keine Hinweise.</p>'
  hints.forEach(({ pl, i }) => {
    const d = document.createElement('div'); d.className = 'hint'
    d.innerHTML = `${pl.name} liegt auf ${i + 1}. ${points[i].name} außerhalb der Ebene<br><button class="btn">Auf den Rand der Ebene verschieben</button> <button class="btn">Zum Zeitpunkt</button>`
    const [fix, go] = d.querySelectorAll('button')
    fix.onclick = () => { Object.assign(pl, clamp(layerAt(i), pl)); render() }
    go.onclick = () => { current = i; render() }
    box.appendChild(d)
  })
}

function render() {
  svg.innerHTML = ''; svg.ondblclick = null
  view === 'raum' ? drawRaum() : drawNetz()
  renderPanel()
}
const tab = (v) => { view = v; document.getElementById('t-raum').classList.toggle('on', v === 'raum'); document.getElementById('t-netz').classList.toggle('on', v === 'netz'); render() }
document.getElementById('t-raum').onclick = () => tab('raum')
document.getElementById('t-netz').onclick = () => tab('netz')
addEventListener('resize', render)
render()
</script>
</body>
</html>
